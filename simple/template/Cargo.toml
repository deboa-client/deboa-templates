[package]
name = "{{project-name}}"
version = "0.1.0"
description = "{{project-description}}"
authors = ["{{authors}}"]
license = "MIT"
edition = "2024"

[dependencies]
deboa = { version = "0.1.5-beta.6" }
deboa-extras = { version = "0.1.1-beta.6", features = ["json"] }
deboa-tokio = { version = "0.1.4-beta.8" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"], default-features = false }
serde = "1.0.219"
serde_json = "1.0.138"
http = "1.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
